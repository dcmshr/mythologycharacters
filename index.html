:root{--ink:#1d2b45;--terra:#c2542d;--paper:#fbf4e4;--paper2:#f3e6c8;--line:#e2d2ad;--gold:#e7a93b;}
body{font-family:'Playpen Sans',sans-serif;color:var(--ink);}
.bg-map{background-image:radial-gradient(circle at 15% 10%,rgba(194,84,45,.10),transparent 40%),radial-gradient(circle at 85% 80%,rgba(29,43,69,.10),transparent 45%),repeating-linear-gradient(0deg,transparent 0 39px,rgba(29,43,69,.05) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(29,43,69,.05) 39px 40px);}
.display{font-family:'Playpen Sans',sans-serif;}
.tab-strip{display:flex;gap:.5rem;overflow-x:auto;padding:.25rem .25rem .75rem;scrollbar-width:thin;}
.tab-btn{flex:0 0 auto;padding:.6rem 1.1rem;border-radius:999px;border:2px solid var(--ink);font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;background:#fffaf0;color:var(--ink);}
.tab-btn:hover{transform:translateY(-2px);}
.tab-btn[aria-selected="true"]{box-shadow:4px 4px 0 var(--ink);outline:3px solid var(--gold);outline-offset:1px;}
.tab-btn:focus-visible,.char-btn:focus-visible{outline:3px solid var(--terra);outline-offset:3px;}
.panel-grid{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;align-items:start;}
@media(max-width:820px){.panel-grid{grid-template-columns:1fr;}.roster{flex-direction:row;overflow-x:auto;}.roster .char-btn{flex:0 0 auto;}}
.roster{display:flex;flex-direction:column;gap:.5rem;counter-reset:hero;}
.char-btn{counter-increment:hero;text-align:left;padding:.65rem .9rem;border-radius:14px;border:2px solid var(--line);background:#fffaf0;font-weight:700;cursor:pointer;transition:all .15s;color:var(--ink);}
.char-btn::before{content:counter(hero);display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;margin-right:.6rem;border-radius:50%;background:var(--paper2);font-size:.85rem;}
.char-btn:hover{border-color:var(--terra);}
.char-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff;}
.char-btn[aria-pressed="true"]::before{background:var(--gold);color:var(--ink);}
.profile{background:#fffdf6;border:2px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:1.75rem;animation:pop .35s ease;}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.story-tag{display:inline-block;padding:.25rem .8rem;border-radius:999px;background:var(--terra);color:#fff;font-weight:700;font-style:italic;}
.hero-name{font-family:'Fraunces',serif;margin:.5rem 0 1.25rem;line-height:1.1;}
.facts{display:grid;grid-template-columns:1fr;gap:.75rem;}
@media(max-width:640px){.facts{grid-template-columns:1fr;}}
.fact{background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:1rem 1.1rem;}
.fact.wide{grid-column:1/-1;background:#fdebd9;border-color:#f0c4a4;}
.fact h4{display:none;}
.fact p{line-height:1.55;}
.panel{animation:pop .35s ease;}
.reveal{animation:pop .6s ease both;}
</style>

  <script>
(function(){
  // Move static panels into main, and profiles into their panel (structure only, no content changes)
  const panelsWrap = document.getElementById('panels');
  document.querySelectorAll('#panel-source > section').forEach(s => panelsWrap.appendChild(s));
  document.getElementById('panel-source').remove();
  document.querySelectorAll('.profiles').forEach(box => {
    const [a,b] = box.dataset.range.split('-').map(Number);
    for (let i=a;i<=b;i++){
      const p = document.getElementById('c'+i);
      if (i !== a) p.classList.add('hidden');
      box.appendChild(p);
    }
  });
  document.getElementById('profile-source').remove();

  // Character selection per panel
  document.querySelectorAll('.panel').forEach(panel => {
    const btns = panel.querySelectorAll('.char-btn');
    btns.forEach((btn,i) => {
      btn.setAttribute('aria-pressed', i===0 ? 'true':'false');
      btn.addEventListener('click', () => {
        btns.forEach(b => b.setAttribute('aria-pressed','false'));
        btn.setAttribute('aria-pressed','true');
        panel.querySelectorAll('.profile').forEach(p => p.classList.toggle('hidden', p.id !== btn.dataset.target));
        if (window.innerWidth < 820) document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth',block:'start'});
      });
    });
  });

  // Tabs
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function selectTab(tab){
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).classList.toggle('hidden', !on);
    });
    tab.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  tabs.forEach((t,i) => {
    t.addEventListener('click', () => selectTab(t));
    t.addEventListener('keydown', e => {
      let n = null;
      if (e.key === 'ArrowRight') n = tabs[(i+1)%tabs.length];
      if (e.key === 'ArrowLeft') n = tabs[(i-1+tabs.length)%tabs.length];
      if (n){ e.preventDefault(); selectTab(n); n.focus(); }
    });
  });
})();
</script>
